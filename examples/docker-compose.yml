# sp-fuseki under Compose.
#
# Note what ISN'T here: no healthcheck, and no entrypoint. Both are in the image
# already, and Compose inherits them. Declaring your own is the main way to break
# this — see the notes below each.

services:
  fuseki:
    image: ghcr.io/semantic-partners/sp-fuseki:6.2.0
    ports:
      - "3030:3030"

    # Config: mount one, or neither for a throwaway in-memory /ds.
    volumes:
      - ./fuseki.edn:/fuseki/fuseki.edn:ro
      - fuseki-data:/fuseki/databases      # only needed for :storage :tdb2

    environment:
      FUSEKI_AUTH: basic
      FUSEKI_ADMIN_PASSWORD_FILE: /run/secrets/fuseki-admin

    secrets:
      - fuseki-admin

    # NO healthcheck stanza. The image's own probe reads the RESOLVED port:
    #
    #   p=$(cat "${FUSEKI_BASE:-/fuseki/run}/port" ...); curl -fsS "http://localhost:${p}/$/ping"
    #
    # so it keeps working when the port comes from fuseki.edn's :server {:port n}
    # or FUSEKI_PORT. A hardcoded `http://localhost:3030/...` here would serve fine
    # and report unhealthy the moment someone changes the port.
    #
    # If you only want different timings, set these and OMIT `test` — Compose keeps
    # the image's probe and overrides just the schedule:
    #
    #   healthcheck:
    #     interval: 5s
    #     timeout: 2s
    #     retries: 3
    #     start_period: 20s
    #
    # And if you do write your own `test`, note the image has curl and NOT wget
    # (it is Debian-based, not Alpine).

    # NO entrypoint / command either. The image's entrypoint resolves config,
    # renders shiro.ini and execs Fuseki; replacing it silently disables every
    # mount and variable above.

volumes:
  fuseki-data:

secrets:
  fuseki-admin:
    file: ./fuseki-admin-password.txt
