name: upstream-check

# Four questions on a timer, none of which builds anything itself:
#
#   jena     — has Apache published a Fuseki newer than our pin?
#   temurin  — has Adoptium shipped a newer build of our Java feature release?
#   jena-keys — has Apache changed the Jena KEYS file we vendor?
#   scan     — do the images we have ALREADY PUBLISHED now have fixable CVEs?
#
# The first three answer with a PR that moves an ARG (ci/bump-pr.sh), not an
# issue: the bump is one line, and a PR puts it through CI where a person merges
# it. They used to open issues, which waited for someone to write that line.
#
# CI ON THOSE PRs. A PR opened with the workflow's GITHUB_TOKEN starts no other
# workflow, so build.yml would not run and the ruleset's build-ok check would
# never appear. Set the UPSTREAM_PR_TOKEN secret (a GitHub App installation token
# or a fine-grained PAT with contents + pull-requests write on this repo) and the
# PRs are opened as that identity, which does start CI. Without it the PR still
# opens, and its body says to close and reopen it to start CI.
#
# The second exists because the CVE gate only ever ran at build time. Nothing
# rebuilds on a schedule, by choice, so a published image rots quietly: `latest`
# sat for a fortnight carrying three fixable HIGH findings in libpcre2 that the
# gate would have failed on, and nothing was going to say so. The base image tag
# floats, so the fix was already waiting in the registry — we simply never looked.
#
# DAILY, not weekly, and the distinction is deliberate: a scan is a minute of
# hosted runner time and publishes nothing. A daily BUILD would republish
# identical bytes under a new tag most days, which is the thing we removed.
# Frequency here buys one thing only — how long a fix sits available while our
# users run without it.

on:
  schedule:
    - cron: "23 7 * * *"   # 07:23 UTC, daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  jena:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the bump branch
      pull-requests: write
      issues: write          # close the issues this job used to open
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.UPSTREAM_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compare upstream Fuseki releases against our pin
        id: check
        run: |
          set -euo pipefail

          # The tarball we actually consume. archive.apache.org is permanent and
          # lists every release; dlcdn is latest-only.
          UPSTREAM="$(curl -fsSL --retry 3 --retry-delay 5 \
            https://archive.apache.org/dist/jena/binaries/ \
            | grep -o 'apache-jena-fuseki-[0-9][0-9.]*\.tar\.gz' \
            | sed 's/^apache-jena-fuseki-//; s/\.tar\.gz$//' \
            | sort -u -V | tail -1)"
          # Empty means the listing changed shape — fail loudly rather than
          # silently reporting "up to date" forever.
          [ -n "$UPSTREAM" ] || { echo "could not parse any release from the Jena archive listing" >&2; exit 1; }

          PINNED="$(sed -n 's/^ARG JENA_VERSION=//p' image/Dockerfile | head -1)"
          [ -n "$PINNED" ] || { echo "could not read ARG JENA_VERSION from image/Dockerfile" >&2; exit 1; }

          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "upstream latest: $UPSTREAM / our default pin: $PINNED"

          # newer = sorts above the pin and isn't equal to it
          if [ "$UPSTREAM" = "$PINNED" ] || \
             [ "$(printf '%s\n%s\n' "$UPSTREAM" "$PINNED" | sort -V | tail -1)" = "$PINNED" ]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
          else
            echo "newer=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open (or keep) the bump PR
        if: steps.check.outputs.newer == 'true'
        env:
          UPSTREAM: ${{ steps.check.outputs.upstream }}
          PINNED: ${{ steps.check.outputs.pinned }}
          OWN_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN != '' }}
        run: |
          set -euo pipefail
          TITLE="Jena ${UPSTREAM} (from ${PINNED})"

          # printf, not a heredoc: an unindented heredoc terminator would end the
          # YAML block scalar this script lives in.
          #
          # Single quotes are intentional throughout: the bodies contain literal
          # markdown backticks and $ that must NOT be expanded by the shell.
          # shellcheck disable=SC2016
          {
            printf 'Apache Jena Fuseki **%s** is on archive.apache.org. This moves `ARG JENA_VERSION` from `%s`, the leg tagged `latest`.\n\n' "$UPSTREAM" "$PINNED"
            printf 'Before merging:\n\n'
            printf -- '- Read the Jena release notes. The smoke test asserts our packaging contract, not Jena correctness.\n'
            printf -- '- If a different release manager signed it, the build fails on `JENA_SIGNING_FINGERPRINT`. Trusting a new signer is a person'"'"'s call: update the fingerprint on this branch.\n'
            printf -- '- To keep publishing `%s`, add it to `EXTRA_JENA` in `ci/sp_fuseki/workflows.clj` and run `bb ci/generate.clj`.\n\n' "$PINNED"
            if [ "$OWN_TOKEN" != "true" ]; then
              printf '**CI has not run.** This PR was opened with the workflow token, which starts no other workflow. Close and reopen it to run `build`.\n\n'
            fi
            printf '_Opened by the `upstream-check` workflow._\n'
          } > "${RUNNER_TEMP}/pr-body.md"

          ci/bump-pr.sh JENA_VERSION "$PINNED" "$UPSTREAM" upstream/jena- "$TITLE" \
            "${RUNNER_TEMP}/pr-body.md" "^Jena [0-9.]+ published upstream"

      - name: Up to date
        if: steps.check.outputs.newer != 'true'
        run: echo "pin ${{ steps.check.outputs.pinned }} is current (upstream latest ${{ steps.check.outputs.upstream }}) — nothing to open"

  temurin:
    # The pin nothing else watches. Dependabot cannot see it — it is a string in
    # a RUN, not a FROM — and Trivy cannot either: it reads jars, and a JRE's
    # lib/modules is not one. So the JVM is both unmanaged and unscanned, which is
    # how ours reached four quarterly security updates behind without a word.
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the bump branch
      pull-requests: write
      issues: write          # close the issues this job used to open
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.UPSTREAM_PR_TOKEN || secrets.GITHUB_TOKEN }}

      # PER ARCH. Adoptium can publish one arch ahead of another: the
      # CVE-2026-114938 point releases shipped for x64 days before aarch64. So the
      # pin is per arch (TEMURIN_VERSION_ARM64, and `/arm64=` in EXTRA_JRE), and
      # each arch's pin is checked against Adoptium's latest FOR THAT ARCH:
      #
      #   x64 moves to x64's latest when that sorts after the pin;
      #   arm64 moves to aarch64's latest when that sorts after ITS pin, and the
      #   override goes (empty) once arm64 would land on the x64 build.
      #
      # So x64 never waits on aarch64, and the override deletes itself when
      # aarch64 catches up. Versions compare by ORDER (sort -V): a pin ahead of
      # Adoptium's latest for an arch is left alone, never moved back.
      - name: Compare each arch's Temurin pins against Adoptium
        id: check
        env:
          # The builds that fix CVE-2026-114938, per major. When every pin on every
          # arch is at or past these, the bump PR says the JDK_JAVA_OPTIONS
          # mitigation can go. Delete this with the mitigation.
          CVE_FIXED_IN: "21.0.13.1 25.0.5.1"
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          X64="$(sed -n 's/^ARG TEMURIN_VERSION=//p' image/Dockerfile | head -1)"
          [ -n "$X64" ] || { echo "could not read ARG TEMURIN_VERSION from image/Dockerfile" >&2; exit 1; }
          # Empty means arm64 takes TEMURIN_VERSION.
          ARM="$(sed -n 's/^ARG TEMURIN_VERSION_ARM64=//p' image/Dockerfile | head -1)"
          # build.yml is generated from ci/sp_fuseki/workflows.clj; it holds the
          # same value and is plain to read from here.
          EXTRA="$(sed -n 's/^ *EXTRA_JRE: *//p' .github/workflows/build.yml | head -1 | tr -d "\"'")"

          # True when $2 sorts strictly after $1.
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$2" ]; }

          latest() {  # major arch
            local v
            v="$(curl -fsSL --retry 3 --retry-delay 5 \
              "https://api.adoptium.net/v3/assets/latest/$1/hotspot?image_type=jre&architecture=$2&os=linux" \
              | jq -r '.[0].release_name // empty' | sed 's/^jdk-//')"
            [ -n "$v" ] || { echo "Adoptium returned no $2 release for $1 — API shape changed" >&2; exit 1; }
            echo "$v"
          }

          # One leg's target: prints "<x64> <arm64 override, or ->".
          target() {  # x64-pin arm64-override
            local x="$1" a="$2" major lx la nx na
            major="${x%%[.+]*}"
            lx="$(latest "$major" x64)"
            la="$(latest "$major" aarch64)"
            nx="$x"; if newer "$x" "$lx"; then nx="$lx"; fi
            na="${a:-$x}"; if newer "$na" "$la"; then na="$la"; fi
            echo "Temurin $major: x64 $x -> $nx (Adoptium $lx); arm64 ${a:-$x} -> $na (Adoptium $la)" >&2
            [ "$na" = "$nx" ] && na=""
            echo "$nx ${na:--}"
          }

          # At or past the CVE fix for its major. A major with no listed fix is not.
          fixed() {
            local v="$1" f
            for f in $CVE_FIXED_IN; do
              [ "${f%%.*}" = "${v%%[.+]*}" ] || continue
              if newer "$v" "$f"; then return 1; fi
              return 0
            done
            return 1
          }

          ALL_FIXED=yes
          T="$(target "$X64" "$ARM")"
          NEW_X64="${T% *}"; NEW_ARM="${T#* }"; [ "$NEW_ARM" = "-" ] && NEW_ARM=""
          if ! fixed "$NEW_X64" || ! fixed "${NEW_ARM:-$NEW_X64}"; then ALL_FIXED=no; fi

          # EXTRA_JRE lives in workflows.clj and regenerates build.yml, which the
          # workflow token may not push. So a stale leg is a warning here, and a
          # line in the bump PR's body when there is one.
          : > "$RUNNER_TEMP/extra.md"
          # Entries are <version> or <version>/arm64=<version>; the split is the point.
          for leg in $EXTRA; do
            v="${leg%%/arm64=*}"
            a="${leg#*/arm64=}"; [ "$a" = "$leg" ] && a=""
            T="$(target "$v" "$a")"
            nv="${T% *}"; na="${T#* }"; [ "$na" = "-" ] && na=""
            want="${nv}${na:+/arm64=$na}"
            if [ "$want" != "$leg" ]; then
              echo "::warning::EXTRA_JRE leg $leg is behind: set it to $want in ci/sp_fuseki/workflows.clj and run bb ci/generate.clj"
              # shellcheck disable=SC2016  # backticks are markdown
              printf -- '- `EXTRA_JRE` in `ci/sp_fuseki/workflows.clj`: `%s` → `%s`, then `bb ci/generate.clj`.\n' "$leg" "$want" >> "$RUNNER_TEMP/extra.md"
            fi
            if ! fixed "$nv" || ! fixed "${na:-$nv}"; then ALL_FIXED=no; fi
          done

          # Only worth saying while the mitigation is still there.
          grep -q '^ENV JDK_JAVA_OPTIONS=.*UseBASE64Intrinsics' image/Dockerfile || ALL_FIXED=no

          if [ "$NEW_X64" != "$X64" ] || [ "$NEW_ARM" != "$ARM" ]; then CHANGED=yes; else CHANGED=no; fi
          {
            echo "changed=$CHANGED"
            echo "x64=$X64"
            echo "arm=$ARM"
            echo "new_x64=$NEW_X64"
            echo "new_arm=$NEW_ARM"
            echo "major=${X64%%[.+]*}"
            echo "all_fixed=$ALL_FIXED"
          } >> "$GITHUB_OUTPUT"
          echo "default leg: changed=$CHANGED x64 $X64 -> $NEW_X64, arm64 override '${ARM}' -> '${NEW_ARM}'; every pin fixed after bump: $ALL_FIXED"

      - name: Open (or keep) the bump PR
        if: steps.check.outputs.changed == 'yes'
        env:
          X64: ${{ steps.check.outputs.x64 }}
          ARM: ${{ steps.check.outputs.arm }}
          NEW_X64: ${{ steps.check.outputs.new_x64 }}
          NEW_ARM: ${{ steps.check.outputs.new_arm }}
          MAJOR: ${{ steps.check.outputs.major }}
          ALL_FIXED: ${{ steps.check.outputs.all_fixed }}
          OWN_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN != '' }}
        run: |
          set -euo pipefail
          # The arm64 override first; bump-pr.sh moves TEMURIN_VERSION and commits
          # everything changed under image/.
          sed -i "s/^ARG TEMURIN_VERSION_ARM64=.*/ARG TEMURIN_VERSION_ARM64=${NEW_ARM}/" image/Dockerfile
          grep -qx "ARG TEMURIN_VERSION_ARM64=${NEW_ARM}" image/Dockerfile \
            || { echo "could not set ARG TEMURIN_VERSION_ARM64=${NEW_ARM} in image/Dockerfile" >&2; exit 1; }
          TITLE="Temurin ${NEW_X64}${NEW_ARM:+, arm64 $NEW_ARM} (from ${X64}${ARM:+, arm64 $ARM})"
          # Backticks throughout are markdown, not command substitution.
          # shellcheck disable=SC2016
          {
            printf 'Moves the Temurin %s pins in `image/Dockerfile`:\n\n' "$MAJOR"
            if [ "$NEW_X64" = "$X64" ]; then
              printf -- '- `TEMURIN_VERSION` (x64): stays `%s`\n' "$X64"
            else
              printf -- '- `TEMURIN_VERSION` (x64): `%s` → `%s`\n' "$X64" "$NEW_X64"
            fi
            if [ "$NEW_ARM" = "$ARM" ]; then
              printf -- '- `TEMURIN_VERSION_ARM64`: stays `%s`. aarch64 has no `%s` yet.\n\n' "$ARM" "$NEW_X64"
            elif [ -n "$NEW_ARM" ]; then
              printf -- '- `TEMURIN_VERSION_ARM64`: `%s` → `%s`. aarch64 has no `%s` yet.\n\n' "${ARM:-(empty)}" "$NEW_ARM" "$NEW_X64"
            else
              printf -- '- `TEMURIN_VERSION_ARM64`: `%s` → empty. aarch64 has the x64 build, so the override goes.\n\n' "${ARM:-(empty)}"
            fi
            printf 'Temurin point releases carry the OpenJDK security fixes, so a stale pin is a JVM with known fixes missing. Trivy cannot see this: it reads jars, and a JRE lib/modules is not one.\n\n'
            if [ -s "$RUNNER_TEMP/extra.md" ]; then
              printf 'Also behind, and not in this PR (the workflow token may not push `build.yml`); make these on this branch:\n\n'
              cat "$RUNNER_TEMP/extra.md"
              printf '\n'
            fi
            if [ "$ALL_FIXED" = "yes" ]; then
              printf 'With this PR%s, every pin on every arch carries the CVE-2026-114938 fix. The `JDK_JAVA_OPTIONS=-XX:-UseBASE64Intrinsics` mitigation in `image/Dockerfile`, its test in `test/dockerfile_test.clj` and `CVE_FIXED_IN` in this workflow can go.\n\n' \
                "$([ -s "$RUNNER_TEMP/extra.md" ] && echo ' and the EXTRA_JRE changes above')"
            fi
            if [ "$OWN_TOKEN" != "true" ]; then
              printf '**CI has not run.** This PR was opened with the workflow token, which starts no other workflow. Close and reopen it to run `build`.\n\n'
            fi
            printf '_Opened by the `upstream-check` workflow._\n'
          } > "${RUNNER_TEMP}/pr-body.md"
          # The branch names the whole target, both arches, so dropping the arm64
          # override is a different PR from an x64 bump to the same version, and a
          # closed x64 bump cannot block it.
          if [ -n "$NEW_ARM" ]; then KEY="${NEW_X64}-arm64-${NEW_ARM}"
          elif [ -n "$ARM" ]; then KEY="${NEW_X64}-arm64-dropped"
          else KEY="$NEW_X64"; fi
          BUMP_KEY="$KEY" \
            ci/bump-pr.sh TEMURIN_VERSION "$X64" "$NEW_X64" "upstream/temurin-${MAJOR}-" "$TITLE" \
            "${RUNNER_TEMP}/pr-body.md" "^Temurin ${MAJOR}: pin is "

  jena-keys:
    # image/jena-KEYS is a vendored copy, pinned by ARG JENA_KEYS_SHA256, so the
    # build needs no network for it. This job is what keeps the copy honest: when
    # Apache's KEYS changes it opens a PR carrying the new file and hash, so a key
    # rotation is a reviewed change rather than a silent change of trust.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.UPSTREAM_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compare Apache's Jena KEYS with the vendored copy
        id: check
        run: |
          set -euo pipefail
          PINNED="$(sed -n 's/^ARG JENA_KEYS_SHA256=//p' image/Dockerfile | head -1)"
          [ -n "$PINNED" ] || { echo "could not read ARG JENA_KEYS_SHA256 from image/Dockerfile" >&2; exit 1; }
          K="${RUNNER_TEMP}/KEYS"
          # Two hosts, same file: one being down is not a finding.
          curl -fsSL --retry 3 --retry-delay 5 https://downloads.apache.org/jena/KEYS -o "$K" \
            || curl -fsSL --retry 3 --retry-delay 5 https://archive.apache.org/dist/jena/KEYS -o "$K"
          NOW="$(sha256sum "$K" | cut -d' ' -f1)"
          { echo "pinned=$PINNED"; echo "now=$NOW"; } >> "$GITHUB_OUTPUT"
          if [ "$NOW" = "$PINNED" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "Jena KEYS unchanged ($NOW)"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "Jena KEYS changed: pinned $PINNED, Apache now $NOW"
          fi

      - name: Open (or keep) the KEYS PR
        if: steps.check.outputs.changed == 'yes'
        env:
          PINNED: ${{ steps.check.outputs.pinned }}
          NOW: ${{ steps.check.outputs.now }}
          OWN_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN != '' }}
        run: |
          set -euo pipefail
          fprs() {
            gpg --batch --with-colons --import-options show-only --import "$1" 2>/dev/null \
              | awk -F: '$1 == "fpr" { print $10 }' | sort -u
          }
          fprs image/jena-KEYS > "${RUNNER_TEMP}/old.fpr"
          fprs "${RUNNER_TEMP}/KEYS" > "${RUNNER_TEMP}/new.fpr"
          cp "${RUNNER_TEMP}/KEYS" image/jena-KEYS
          TITLE="Jena KEYS changed upstream (${NOW:0:12})"
          # Backticks throughout are markdown, not command substitution.
          # shellcheck disable=SC2016
          {
            # shellcheck disable=SC2016  # backticks are markdown
            printf 'Apache'"'"'s Jena `KEYS` no longer matches `image/jena-KEYS`. This PR carries the new file and moves `ARG JENA_KEYS_SHA256`.\n\n'
            printf 'Fingerprints added (keys and subkeys):\n\n```\n'
            comm -13 "${RUNNER_TEMP}/old.fpr" "${RUNNER_TEMP}/new.fpr"
            printf '```\n\nFingerprints removed:\n\n```\n'
            comm -23 "${RUNNER_TEMP}/old.fpr" "${RUNNER_TEMP}/new.fpr"
            printf '```\n\n'
            # shellcheck disable=SC2016
            printf 'The build accepts only a signature from `JENA_SIGNING_FINGERPRINT`, so this PR alone changes no trust. A release signed by a new key also needs that fingerprint changed: check the key against the Apache committer key list first.\n\n'
            if [ "$OWN_TOKEN" != "true" ]; then
              # shellcheck disable=SC2016
              printf '**CI has not run.** This PR was opened with the workflow token, which starts no other workflow. Close and reopen it to run `build`.\n\n'
            fi
            # shellcheck disable=SC2016
            printf '_Opened by the `upstream-check` workflow._\n'
          } > "${RUNNER_TEMP}/pr-body.md"
          # Not upstream/jena-: the jena job closes every other PR on that prefix.
          ci/bump-pr.sh JENA_KEYS_SHA256 "$PINNED" "$NOW" upstream/keys-jena- "$TITLE" \
            "${RUNNER_TEMP}/pr-body.md"

  scan:
    # The published images, not a fresh build. A build would pull today's base and
    # come up clean while the thing our users are actually running stays broken —
    # the question here is what is in the registry, not what we could make.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write      # to start the rebuild that fixes Debian findings
      pull-requests: read # to list the bump PRs when a rebuild cannot
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ghcr.io/semantic-partners/sp-fuseki
    steps:
      - name: Which tags do people actually pull
        id: tags
        run: |
          set -euo pipefail
          # n=1000 because the default page is 100 and this registry already holds
          # 157 tags — the first version of this silently scanned a page and never
          # saw the jre legs at all.
          TOKEN="$(curl -fsSL "https://ghcr.io/token?scope=repository:semantic-partners/sp-fuseki:pull&service=ghcr.io" | jq -r .token)"
          ALL="$(curl -fsSL -H "Authorization: Bearer $TOKEN" \
            "https://ghcr.io/v2/semantic-partners/sp-fuseki/tags/list?n=1000" | jq -r '.tags[]')"
          [ -n "$ALL" ] || { echo "no tags returned — the registry or the token shape changed" >&2; exit 1; }
          # An ALLOWLIST of the tags people deploy by name: latest, a Jena version,
          # and a Jena version on a non-default JRE. Everything else in there is an
          # immutable build — calver-stamped, the older run-numbered ones, pr-* and
          # cosign's sha256-* signatures — and scanning those reports the same
          # finding dozens of times about images nobody pulls. A denylist would let
          # each new stamped format back in; this cannot.
          TAGS="$(printf '%s\n' "$ALL" \
            | grep -E '^latest$|^[0-9]+\.[0-9]+\.[0-9]+$|^[0-9]+\.[0-9]+\.[0-9]+-jre[0-9]+$' \
            | sort -u)"
          [ -n "$TAGS" ] || { echo "no moving tags matched — the tag scheme changed and this filter did not" >&2; exit 1; }
          # $TAGS is a list, so the split is the point.
          # shellcheck disable=SC2086
          { echo "scanning:"; printf '  %s\n' $TAGS; }
          # shellcheck disable=SC2086
          echo "tags=$(printf '%s ' $TAGS)" >> "$GITHUB_OUTPUT"

      - name: Scan each one for findings that HAVE a fix
        id: scan
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          # --ignore-unfixed, same as the build gate: an unfixed CVE is not an
          # action, it is a subscription. This job exists to say "there is a fix
          # and you are not running it".
          : > /tmp/findings.md
          TOTAL=0
          for t in $TAGS; do
            echo "== $IMAGE:$t"
            docker run --rm aquasec/trivy:latest image --quiet --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --format json "$IMAGE:$t" > "/tmp/$t.json" || {
                echo "::warning::trivy failed for $t — treating as unknown, not clean"; continue; }
            N="$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' "/tmp/$t.json")"
            echo "   $N fixable"
            TOTAL=$((TOTAL + N))
            if [ "$N" -gt 0 ]; then
              {
                echo "### \`$t\` — $N fixable"
                echo
                echo "| package | installed | fixed in | id |"
                echo "|---|---|---|---|"
                jq -r '[.Results[]?.Vulnerabilities // []] | flatten
                       | sort_by(.PkgName) | .[]
                       | "| \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | [\(.VulnerabilityID)](\(.PrimaryURL)) |"' \
                  "/tmp/$t.json" | sort -u
                echo
              } >> /tmp/findings.md
            fi
          done
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          # A fingerprint of WHAT was found, not how much. It decides whether a
          # rebuild is worth attempting: the same finding-set two days running
          # means the last rebuild did not clear it, and doing it again just
          # republishes identical bytes under a new tag every morning.
          FP="$(cat /tmp/*.json 2>/dev/null \
                | jq -r '[.Results[]?.Vulnerabilities // []] | flatten | .[] | "\(.VulnerabilityID):\(.FixedVersion)"' \
                | sort -u | sha256sum | cut -c1-12)"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "finding fingerprint: $FP"
          { echo "## Published images"; echo; [ "$TOTAL" -gt 0 ] && cat /tmp/findings.md || echo "No fixable HIGH or CRITICAL findings."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the issue
        env:
          TOTAL: ${{ steps.scan.outputs.total }}
          FP: ${{ steps.scan.outputs.fingerprint }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="Published images have fixable HIGH/CRITICAL findings"
          NUM="$(gh issue list --repo "$REPO" --state open --limit 100 \
                 --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"

          if [ "$TOTAL" -eq 0 ]; then
            # Closing it is the point. An issue that stays open after the fix
            # ships is how a tracker stops being read.
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --repo "$REPO" \
                --comment "Clean as of $(date -u +%Y-%m-%d): no fixable HIGH or CRITICAL findings in the published images."
              echo "closed #$NUM"
            else
              echo "clean, and nothing open"
            fi
            exit 0
          fi

          {
            echo "Trivy found **$TOTAL** fixable HIGH/CRITICAL findings in images that are published right now."
            echo
            echo "Fixable means the fix exists and our users are not running it. Every build re-runs"
            echo "\`apt-get upgrade\` (APT_REFRESH), so a rebuild of \`main\` takes Debian fixes with no source change."
            echo
            cat /tmp/findings.md
            echo "_Checked $(date -u +%Y-%m-%d\ %H:%M) UTC. This issue closes itself when a scan comes back clean._"
            echo "<!-- fingerprint:$FP -->"
          } > /tmp/body.md

          # A REBUILD FIXES DEBIAN PACKAGES: each build re-runs `apt-get upgrade`, so
          # the patched package in the archive lands with no source change. Trigger
          # one, once per finding-set. If the same fingerprint comes back tomorrow
          # the rebuild did not clear it, and the cause is one a rebuild cannot
          # reach — a jar that only a Jena bump replaces, a fix Debian has not
          # shipped, or a tag no current build publishes. Say so, and point at the
          # bump PRs, instead of republishing identical bytes every morning.
          PREV=""
          [ -n "$NUM" ] && PREV="$(gh issue view "$NUM" --repo "$REPO" --json body --jq '.body' \
                                   | sed -n 's/.*<!-- fingerprint:\([a-f0-9]*\) -->.*/\1/p' | head -1)"
          if [ "$PREV" = "$FP" ]; then
            echo "same findings as the last run ($FP) — a rebuild did not clear them, not repeating it"
            REBUILD="no — the last rebuild did not clear these, so a rebuild cannot"
            BUMPS="$(gh pr list --repo "$REPO" --state open --label upstream --json number,title \
                       --jq '.[] | "- #\(.number) \(.title)"')"
            {
              echo
              echo "**A rebuild cannot clear these.** Check, in order: a finding in a jar needs a Jena bump;"
              echo "a finding on a tag no build publishes any more needs that tag rebuilt by a tag rule or retired;"
              echo "otherwise Debian has not shipped the fix yet."
              echo
              if [ -n "$BUMPS" ]; then echo "Open bump PRs:"; echo; echo "$BUMPS"; else echo "No bump PR is open."; fi
            } >> /tmp/body.md
          else
            gh workflow run build.yml --repo "$REPO" --ref main
            echo "dispatched a rebuild on main"
            REBUILD="yes — dispatched $(date -u +%H:%M) UTC"
          fi
          sed -i "s|_Checked |_Rebuild: $REBUILD. Checked |" /tmp/body.md

          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "$REPO" --body-file /tmp/body.md
            echo "updated #$NUM"
          else
            # --label is best-effort: a missing label must not swallow the finding.
            # The first run died exactly here, with the scan already done and the
            # CVEs already known, because the label did not exist yet.
            gh issue create --repo "$REPO" --title "$TITLE" --label security --body-file /tmp/body.md \
              || gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/body.md
          fi
