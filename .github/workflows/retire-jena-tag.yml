name: retire-jena-tag

# Retire a published Jena leg: delete every version tagged `<jena>` or
# `<jena>-<run>`. Issue #23.
#
# It used to retag as `<jena>-unsupported` first, so anyone pinned got a name that
# still resolved and told them the truth. That cannot work, and the first live run
# proved it: `imagetools create` is ADDITIVE, so the new tag landed on the SAME
# manifest as the plain one. GHCR deletes at version granularity — one digest, many
# tags, no per-tag delete — so `6.1.0` and `6.1.0-unsupported` were one object, and
# the guard protecting the new tag protected the old one too. The run reported
# success having deleted the numbered tags and silently skipped the one that
# mattered.
#
# Preserving the bytes under a different name would need a genuinely different
# manifest (a re-push with an added annotation). Not worth it for a courtesy to
# nobody: an image we will not patch should stop resolving.
#
# Manual only, and dry-run by default. This deletes published artifacts, which is
# not something a schedule or a push should ever decide.

on:
  workflow_dispatch:
    inputs:
      jena:
        description: "Jena version to retire, e.g. 6.1.0"
        required: true
        type: string
      execute:
        description: "Actually delete. Leave false to see what would happen."
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to retire the current default
        env:
          JENA: ${{ inputs.jena }}
        run: |
          set -euo pipefail
          DEF="$(sed -n 's/^ARG JENA_VERSION=//p' image/Dockerfile | head -1)"
          echo "requested: $JENA / current default: $DEF"
          if [ "$JENA" = "$DEF" ]; then
            echo "::error::$JENA is the version image/Dockerfile currently pins, so it is what \`latest\` points at. Bump the pin first." >&2
            exit 1
          fi

      - name: Find the versions that would be dropped
        id: find
        env:
          JENA: ${{ inputs.jena }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Plain `<jena>` and any `<jena>-<run>`; never anything tagged latest.
          # There is no -unsupported exclusion any more: it would have matched the
          # same version as the plain tag and protected what we came to delete.
          gh api --paginate "/orgs/${OWNER}/packages/container/sp-fuseki/versions" \
            --jq '.[] | {id, tags: .metadata.container.tags}' > /tmp/versions.jsonl
          jq -c --arg j "$JENA" '
            select(any(.tags[]?; . == $j or startswith($j + "-")))
            | select(all(.tags[]?; . != "latest"))
          ' /tmp/versions.jsonl > /tmp/targets.jsonl || true
          COUNT="$(wc -l < /tmp/targets.jsonl | tr -d ' ')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "### Versions matching \`${JENA}\`"
            echo
            echo '```'
            cat /tmp/targets.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/targets.jsonl

      - name: Delete them
        if: inputs.execute
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while read -r line; do
            [ -n "$line" ] || continue
            id="$(echo "$line" | jq -r .id)"
            tags="$(echo "$line" | jq -rc .tags)"
            echo "deleting version $id $tags"
            # A repo-scoped GITHUB_TOKEN cannot always delete org package versions.
            # If that is the case, say so plainly rather than reporting success.
            gh api -X DELETE "/orgs/${OWNER}/packages/container/sp-fuseki/versions/${id}" \
              || { echo "::error::delete failed for $id — a PAT with delete:packages may be required" >&2; exit 1; }
          done < /tmp/targets.jsonl

      - name: What happened
        env:
          JENA: ${{ inputs.jena }}
          COUNT: ${{ steps.find.outputs.count }}
          EXECUTED: ${{ inputs.execute }}
        run: |
          set -euo pipefail
          {
            echo "- matching versions: ${COUNT}"
            if [ "$EXECUTED" = "true" ]; then
              echo "- deleted: yes"
            else
              echo "- deleted: **no** (dry run — re-run with \`execute: true\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
