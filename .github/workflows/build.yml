name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily rebuild of every Jena leg — picks up base-image/JRE patches and
    # re-runs the smoke test against the current pins. New-Jena detection is
    # Renovate + the weekly upstream-check workflow, not this.
    - cron: "17 6 * * *"

env:
  REGISTRY: ghcr.io

jobs:
  # One place decides what we build. The Dockerfile's JENA_VERSION (Renovate-managed)
  # is the default leg — it gets the moving `latest` tag. EXTRA_JENA lists the older
  # versions we still publish alongside it.
  plan:
    runs-on: ubuntu-latest
    env:
      EXTRA_JENA: "6.1.0"
    outputs:
      default: ${{ steps.p.outputs.default }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          set -euo pipefail
          DEF="$(sed -n 's/^ARG JENA_VERSION=//p' image/Dockerfile | head -1)"
          [ -n "$DEF" ] || { echo "could not read ARG JENA_VERSION from image/Dockerfile" >&2; exit 1; }
          MATRIX="$(printf '%s\n' $EXTRA_JENA "$DEF" | sed '/^$/d' | sort -u -V | jq -R . | jq -sc .)"
          echo "default=$DEF" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "jena legs: $MATRIX  (latest -> $DEF)"

  # Gate: build amd64, load locally, assert the packaging contract. Per Jena leg.
  smoke:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jena: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64, load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          load: true
          tags: sp-fuseki:ci-${{ matrix.jena }}
          platforms: linux/amd64
          build-args: |
            JENA_VERSION=${{ matrix.jena }}
      - name: Packaging smoke test
        run: IMAGE=sp-fuseki:ci-${{ matrix.jena }} bash test/smoke.sh

  # Publish: multi-arch build + push, SBOM, scan, sign. Skips PRs. Per Jena leg.
  publish:
    needs: [plan, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jena: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless
    steps:
      - uses: actions/checkout@v4

      - name: Derive image name (lowercase — GHCR requires it)
        id: ver
        run: |
          echo "image=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/sp-fuseki" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata / two-axis tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=${{ matrix.jena }}-${{ github.run_number }}
            type=raw,value=${{ matrix.jena }}
            type=raw,value=latest,enable=${{ matrix.jena == needs.plan.outputs.default && github.ref == 'refs/heads/main' }}

      - name: Build + push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JENA_VERSION=${{ matrix.jena }}
          provenance: true
          sbom: true

      - name: Trivy scan (report; non-blocking until we triage a baseline)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ver.outputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Sign image (cosign keyless)
        env:
          IMG: ${{ steps.ver.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMG}@${DIGEST}"
