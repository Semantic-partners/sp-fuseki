# GENERATED by ci/sp_fuseki/workflows.clj — DO NOT EDIT.
#
# Edit the Clojure and regenerate (the pre-commit hook does it for you):
#   bb ci/generate.clj
#
# Why generated: Actions YAML has no compiler and nothing to test. The
# invariants that matter — `latest` only on the default leg, publish never
# enabled for fork PRs, arm64 never on a hosted runner — are asserted in
# test/workflows_test.clj. The reasoning lives in the source, at length.

name: build
'on':
  push:
    branches:
    - main
    tags:
    - v*
  pull_request: null
  workflow_dispatch: null
env:
  REGISTRY: ghcr.io
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      EXTRA_JENA: ''
      SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      IS_PUBLIC: ${{ github.event.repository.private == false }}
    outputs:
      default: ${{ steps.p.outputs.default }}
      matrix: ${{ steps.p.outputs.matrix }}
      arches: ${{ steps.p.outputs.arches }}
      image: ${{ steps.p.outputs.image }}
    steps:
    - uses: actions/checkout@v4
    - id: p
      run: |
        set -euo pipefail
        DEF="$(sed -n 's/^ARG JENA_VERSION=//p' image/Dockerfile | head -1)"
        [ -n "$DEF" ] || { echo "could not read ARG JENA_VERSION from image/Dockerfile" >&2; exit 1; }
        # EXTRA_JENA is a space-separated list, so the split is deliberate.
        # shellcheck disable=SC2086
        MATRIX="$(printf '%s\n' $EXTRA_JENA "$DEF" | sed '/^$/d' | sort -u -V | jq -R . | jq -sc .)"
        OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
        # A self-hosted runner executes whatever the workflow says, on a real
        # machine with persistent state and LAN access. Fork PRs get hosted
        # amd64 only — still tested, just not on our hardware.
        #
        # And if this repo is PUBLIC, no event is safe enough: approval settings
        # are a checkbox someone can change, and GitHub's own guidance is not to
        # use self-hosted runners with public repos at all. Fail rather than
        # quietly dropping arm64 — a silently single-arch pipeline is worse, and
        # the choice (fence the Mac, or move arm64 to hosted arm runners) is a
        # decision someone has to take. See issue #9.
        if [ "$IS_PUBLIC" = "false" ] && [ "$SAME_REPO" = "true" ]; then
          ARCHES='["amd64", "arm64"]'
        elif [ "$IS_PUBLIC" = "true" ]; then
          echo "::error::This repo is public and the arm64 leg targets a self-hosted" \
               "runner. Move arm64 to hosted arm runners, or restrict the runner to" \
               "private repos and remove this guard deliberately. See issue #9." >&2
          exit 1
        else
          ARCHES='["amd64"]'
          echo "fork PR: omitting the self-hosted arm64 leg"
        fi
        {
          echo "default=$DEF"
          echo "matrix=$MATRIX"
          echo "arches=$ARCHES"
          # GHCR requires a lowercase image name.
          echo "image=${REGISTRY}/${OWNER}/sp-fuseki"
        } >> "$GITHUB_OUTPUT"
        echo "jena legs: $MATRIX  (latest -> $DEF)"
  test:
    needs: plan
    runs-on: ${{ matrix.arch == 'arm64' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        jena: ${{ fromJSON(needs.plan.outputs.matrix) }}
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build (native, load)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: image/Dockerfile
        load: true
        tags: sp-fuseki:ci-${{ matrix.jena }}
        platforms: linux/${{ matrix.arch }}
        build-args: |
          JENA_VERSION=${{ matrix.jena }}
        cache-from: type=gha,scope=jena-${{ matrix.jena }}-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=jena-${{ matrix.jena }}-${{ matrix.arch }}
    - name: Unit tests (fuseki.edn renderer + this workflow)
      run: |
        docker run --rm -v "$PWD:/w" -w /w \
          --entrypoint bash sp-fuseki:ci-${{ matrix.jena }} test/unit.sh
    - name: Packaging smoke test
      run: IMAGE=sp-fuseki:ci-${{ matrix.jena }} bash test/smoke.sh
  publish:
    needs:
    - plan
    - test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.arch == 'arm64' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        jena: ${{ fromJSON(needs.plan.outputs.matrix) }}
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Isolate docker credentials, keep the daemon endpoint
      run: |
        set -euo pipefail
        HOST="$(docker context inspect --format '{{.Endpoints.docker.Host}}')"
        echo "docker endpoint: $HOST"
        mkdir -p "$RUNNER_TEMP/.docker"
        {
          echo "DOCKER_HOST=$HOST"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker"
        } >> "$GITHUB_ENV"
    - uses: docker/setup-buildx-action@v3
    - name: Write registry credentials (no credential helper)
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        AUTH="$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 | tr -d '\n')"
        umask 077
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" \
          > "$DOCKER_CONFIG/config.json"
        echo "wrote auth for $REGISTRY to $DOCKER_CONFIG/config.json"
    - name: Build + push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: image/Dockerfile
        platforms: linux/${{ matrix.arch }}
        build-args: |
          JENA_VERSION=${{ matrix.jena }}
        outputs: type=image,name=${{ needs.plan.outputs.image }},push-by-digest=true,name-canonical=true,push=true
        provenance: true
        sbom: true
        cache-from: type=gha,scope=jena-${{ matrix.jena }}-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=jena-${{ matrix.jena }}-${{ matrix.arch }}
    - name: Stash the digest for the merge job
      run: |
        set -euo pipefail
        mkdir -p /tmp/digests
        echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"
    - uses: actions/upload-artifact@v4
      with:
        name: digest-${{ matrix.jena }}-${{ matrix.arch }}
        path: /tmp/digests/*
        retention-days: 1
        if-no-files-found: error
    - name: Remove the credential file
      if: always()
      run: |
        set -euo pipefail
        [ -n "${DOCKER_CONFIG:-}" ] && rm -f "$DOCKER_CONFIG/config.json" || true
  merge:
    needs:
    - plan
    - publish
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jena: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: digest-${{ matrix.jena }}-*
        merge-multiple: true
        path: /tmp/digests
    - uses: docker/setup-buildx-action@v3
    - name: Install cosign 2.5.2
      if: github.event_name != 'pull_request'
      env:
        COSIGN_VERSION: 2.5.2
      run: |
        set -euo pipefail
        base="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
        curl -fsSL --retry 8 --retry-max-time 300 --retry-all-errors --connect-timeout 20 \
          "$base/cosign-linux-amd64" -o "$RUNNER_TEMP/cosign"
        curl -fsSL --retry 8 --retry-max-time 300 --retry-all-errors --connect-timeout 20 \
          "$base/cosign_checksums.txt" -o "$RUNNER_TEMP/cosign_checksums.txt"
        # A signing tool is the last thing that should be a partial download.
        sum="$(grep -E ' cosign-linux-amd64$' "$RUNNER_TEMP/cosign_checksums.txt" | cut -d' ' -f1)"
        echo "$sum  $RUNNER_TEMP/cosign" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/cosign"
        mkdir -p "$RUNNER_TEMP/bin"
        mv "$RUNNER_TEMP/cosign" "$RUNNER_TEMP/bin/cosign"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Metadata / two-axis tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ needs.plan.outputs.image }}
        tags: |
          type=raw,value=${{ matrix.jena }}-${{ github.run_number }},enable=${{ github.event_name != 'pull_request' }}
          type=raw,value=${{ matrix.jena }},enable=${{ github.event_name != 'pull_request' }}
          type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && matrix.jena == needs.plan.outputs.default && github.ref == 'refs/heads/main' }}
          type=raw,value=pr-${{ github.event.number }}-${{ matrix.jena }},enable=${{ github.event_name == 'pull_request' }}
    - name: Create the manifest list
      id: merge
      env:
        IMAGE: ${{ needs.plan.outputs.image }}
      run: |
        set -euo pipefail
        ls -1 /tmp/digests
        # -t per resolved tag, then one image@digest per arch. Both
        # substitutions MUST word-split — they expand to argument lists.
        # shellcheck disable=SC2046
        docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(for f in /tmp/digests/*; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
        # The manifest-list digest is what we scan and sign.
        FIRST_TAG="$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
        DIGEST="$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{json .Manifest}}' | jq -r .digest)"
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
        echo "published $FIRST_TAG -> $DIGEST"
    - name: Verify both architectures are in the manifest
      env:
        IMAGE: ${{ needs.plan.outputs.image }}
        DIGEST: ${{ steps.merge.outputs.digest }}
      run: |
        set -euo pipefail
        PLATFORMS="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw \
          | jq -r '[.manifests[] | select(.platform.os=="linux") | "\(.platform.os)/\(.platform.architecture)"] | unique | join(" ")')"
        echo "platforms: $PLATFORMS"
        for want in linux/amd64 linux/arm64; do
          case "$PLATFORMS" in *"$want"*) ;; *) echo "missing $want in the manifest" >&2; exit 1 ;; esac
        done
    - name: Verify the SBOM is attached and populated
      env:
        IMAGE: ${{ needs.plan.outputs.image }}
        DIGEST: ${{ steps.merge.outputs.digest }}
      run: |
        set -euo pipefail
        SBOM="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .SBOM}}')"
        for plat in linux/amd64 linux/arm64; do
          n="$(jq -r --arg p "$plat" '.[$p].SPDX.packages | length' <<< "$SBOM")"
          echo "$plat: $n packages"
          [ "$n" -gt 50 ] || { echo "::error::SBOM for $plat has $n packages — not populated" >&2; exit 1; }
          jq -e --arg p "$plat" '[.[$p].SPDX.packages[].name] | index("curl")' <<< "$SBOM" >/dev/null \
            || { echo "::error::SBOM for $plat does not list curl, which the healthcheck needs" >&2; exit 1; }
        done
    - name: Trivy — fail only on vulnerabilities that HAVE a fix
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ needs.plan.outputs.image }}@${{ steps.merge.outputs.digest }}
        format: table
        ignore-unfixed: true
        exit-code: '1'
        severity: HIGH,CRITICAL
    - name: Trivy — full report (SARIF)
      if: github.event_name != 'pull_request' && always()
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ needs.plan.outputs.image }}@${{ steps.merge.outputs.digest }}
        format: sarif
        output: trivy.sarif
        exit-code: '0'
        severity: HIGH,CRITICAL
    - name: Keep the report
      if: github.event_name != 'pull_request' && always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-${{ matrix.jena }}
        path: trivy.sarif
        retention-days: 30
        if-no-files-found: warn
    - name: Upload to code scanning (public repos only)
      if: github.event_name != 'pull_request' && always() && github.event.repository.private == false
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy.sarif
        category: trivy-${{ matrix.jena }}
    - name: Sign image (cosign keyless)
      if: github.event_name != 'pull_request'
      env:
        IMG: ${{ needs.plan.outputs.image }}
        DIGEST: ${{ steps.merge.outputs.digest }}
      run: |
        cosign sign --yes "${IMG}@${DIGEST}"
