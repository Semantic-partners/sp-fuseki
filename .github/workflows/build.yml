name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
# No cron. We build on version bumps, not on a clock: Renovate raises the PR and
# the weekly upstream-check workflow catches anything it misses. Trade-off taken
# knowingly — base-image/JRE CVE patches now land only when something bumps or
# someone dispatches this manually.

env:
  REGISTRY: ghcr.io

# Two runs racing on the same ref can land `latest` on the older commit's default
# Jena. Newest push wins; supersede the one in flight.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One place decides what we build. The Dockerfile's JENA_VERSION (Renovate-managed)
  # is the default leg — it gets the moving `latest` tag. EXTRA_JENA lists the older
  # versions we still publish alongside it.
  plan:
    runs-on: ubuntu-latest
    env:
      EXTRA_JENA: "6.1.0"
    outputs:
      default: ${{ steps.p.outputs.default }}
      matrix: ${{ steps.p.outputs.matrix }}
      image: ${{ steps.p.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          set -euo pipefail
          DEF="$(sed -n 's/^ARG JENA_VERSION=//p' image/Dockerfile | head -1)"
          [ -n "$DEF" ] || { echo "could not read ARG JENA_VERSION from image/Dockerfile" >&2; exit 1; }
          # EXTRA_JENA is a space-separated list, so the split is deliberate.
          # shellcheck disable=SC2086
          MATRIX="$(printf '%s\n' $EXTRA_JENA "$DEF" | sed '/^$/d' | sort -u -V | jq -R . | jq -sc .)"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "default=$DEF"
            echo "matrix=$MATRIX"
            # GHCR requires a lowercase image name.
            echo "image=${REGISTRY}/${OWNER}/sp-fuseki"
          } >> "$GITHUB_OUTPUT"
          echo "jena legs: $MATRIX  (latest -> $DEF)"

  # Gate: build and test EACH ARCH NATIVELY. amd64 on hosted, arm64 on the
  # self-hosted Apple Silicon runner — so arm64 is exercised in CI at all, which
  # it never was while the only arm64 build was an emulated publish.
  test:
    needs: plan
    runs-on: ${{ matrix.arch == 'arm64' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        jena: ${{ fromJSON(needs.plan.outputs.matrix) }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (native, load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          load: true
          tags: sp-fuseki:ci-${{ matrix.jena }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            JENA_VERSION=${{ matrix.jena }}
          # Shared with publish below, so the JRE/Fuseki/babashka downloads happen
          # once per leg instead of once per job. Fewer requests is the real fix
          # for the GitHub 503s that kept failing publish.
          cache-from: type=gha,scope=jena-${{ matrix.jena }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=jena-${{ matrix.jena }}-${{ matrix.arch }}

      # Renderer contract, run with the bb that actually ships in the image — no
      # third-party setup action, no chance of testing a different bb version than
      # the entrypoint uses. Sub-second, so it runs before the slow tests.
      - name: Unit tests (fuseki.edn renderer)
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            --entrypoint bash sp-fuseki:ci-${{ matrix.jena }} test/unit.sh

      - name: Packaging smoke test
        run: IMAGE=sp-fuseki:ci-${{ matrix.jena }} bash test/smoke.sh

  # Publish per arch, pushed BY DIGEST with no tags. No QEMU anywhere: each arch
  # is built by a runner of that arch. Tags are applied once, in `merge`.
  publish:
    needs: [plan, test]
    # Runs on same-repo PRs too: pushed BY DIGEST with no release tags, so the
    # publish path is proven before merge instead of after. Fork PRs get no
    # packages:write token, so they build and test only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.arch == 'arm64' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      # Left parallel: the two arches share almost no layer blobs, so this isn't
      # the shared-blob contention that made GHCR 403 a blob HEAD when two
      # same-arch multi-arch pushes raced.
      matrix:
        jena: ${{ fromJSON(needs.plan.outputs.matrix) }}
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The arm64 legs run on a self-hosted macOS runner, where Docker Desktop's
      # default credential helper is the Keychain. A runner with no interactive
      # session cannot write there: `docker login` fails with "User interaction is
      # not allowed. (-25308)" — which is why the arm64 test jobs pass (they never
      # log in) and only publish failed. A DOCKER_CONFIG of our own has no
      # credsStore, so the short-lived GITHUB_TOKEN lands in a temp file and is
      # discarded with the job.
      #
      # Exported here rather than in job-level `env:` because the `runner` context
      # isn't available there — using it invalidates the whole workflow file.
      #
      # The endpoint is captured FIRST, from the runner's real config: on macOS
      # Docker Desktop the daemon lives at ~/.docker/run/docker.sock and is found
      # via the docker *context*, so pointing DOCKER_CONFIG at an empty dir loses
      # it and buildx falls back to /var/run/docker.sock, which isn't there.
      # Fixing the Keychain without this broke daemon discovery instead.
      - name: Isolate docker credentials, keep the daemon endpoint
        run: |
          set -euo pipefail
          HOST="$(docker context inspect --format '{{.Endpoints.docker.Host}}')"
          echo "docker endpoint: $HOST"
          mkdir -p "$RUNNER_TEMP/.docker"
          {
            echo "DOCKER_HOST=$HOST"
            echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3

      # Deliberately NOT docker/login-action. On the macOS runner `docker login`
      # hands the credential to Docker Desktop's Keychain helper, which fails with
      # "User interaction is not allowed. (-25308)" without an interactive session
      # — and the macOS CLI selects that helper by DEFAULT, so an empty
      # DOCKER_CONFIG doesn't avoid it. Writing the auth entry ourselves uses no
      # helper at all. The token is job-scoped and dies with the temp dir.
      - name: Write registry credentials (no credential helper)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 | tr -d '\n')"
          umask 077
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" \
            > "$DOCKER_CONFIG/config.json"
          echo "wrote auth for $REGISTRY to $DOCKER_CONFIG/config.json"

      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            JENA_VERSION=${{ matrix.jena }}
          outputs: type=image,name=${{ needs.plan.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=jena-${{ matrix.jena }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=jena-${{ matrix.jena }}-${{ matrix.arch }}

      - name: Stash the digest for the merge job
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.jena }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Assemble one multi-arch manifest per Jena leg from the per-arch digests, then
  # tag, scan and sign it. Tag logic lives here alone, so `latest` can't be
  # applied twice or by the wrong arch.
  merge:
    needs: [plan, publish]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jena: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.jena }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata / two-axis tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.plan.outputs.image }}
          tags: |
            type=raw,value=${{ matrix.jena }}-${{ github.run_number }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ matrix.jena }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && matrix.jena == needs.plan.outputs.default && github.ref == 'refs/heads/main' }}
            # Disposable, so a PR can exercise create/inspect/platform-assert
            # without touching a tag anyone consumes.
            type=raw,value=pr-${{ github.event.number }}-${{ matrix.jena }},enable=${{ github.event_name == 'pull_request' }}

      - name: Create the manifest list
        id: merge
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          set -euo pipefail
          ls -1 /tmp/digests
          # -t for every tag metadata-action resolved, then one image@digest per arch.
          # Both substitutions MUST word-split — they expand to argument lists.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for f in /tmp/digests/*; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
          # The manifest-list digest is what we scan and sign.
          FIRST_TAG="$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          DIGEST="$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "published $FIRST_TAG -> $DIGEST"

      - name: Verify both architectures are in the manifest
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          set -euo pipefail
          PLATFORMS="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw \
            | jq -r '[.manifests[] | select(.platform.os=="linux") | "\(.platform.os)/\(.platform.architecture)"] | unique | join(" ")')"
          echo "platforms: $PLATFORMS"
          for want in linux/amd64 linux/arm64; do
            case "$PLATFORMS" in *"$want"*) ;; *) echo "missing $want in the manifest" >&2; exit 1 ;; esac
          done

      - name: Trivy scan (report; non-blocking until we triage a baseline)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.plan.outputs.image }}@${{ steps.merge.outputs.digest }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Sign image (cosign keyless)
        if: github.event_name != 'pull_request'
        env:
          IMG: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          cosign sign --yes "${IMG}@${DIGEST}"
